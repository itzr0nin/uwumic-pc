name: Build Windows app
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install (PyInstaller is built from source when possible - fewer false virus alerts)
        shell: pwsh
        run: |
          pip install sounddevice numpy pyrnnoise
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install pyinstaller --no-binary pyinstaller
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Building PyInstaller's launcher failed, using the standard one instead"
            pip install --force-reinstall pyinstaller
          }
      - name: Build (a folder, not a self-unpacking single file; bundles vbcable.zip if you added it)
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path vbcable.zip) { $extra += "--add-data"; $extra += "vbcable.zip;." }
          pyinstaller --noconfirm --onedir --noconsole --name UwUMicClient --icon uwumic.ico --version-file version_info.txt --add-data "uwumic.ico;." --collect-all pyrnnoise --exclude-module audiolab --exclude-module av @extra uwumic_client.py
      - name: Self-test noise cancellation inside the built app (does not block the build)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\UwUMicClient\UwUMicClient.exe -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no selftest output" }
          if ($p.ExitCode -ne 0) { throw "noise cancellation self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: UwUMicClient-windows
          path: dist/UwUMicClient
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: selftest-result
          path: selftest.txt
