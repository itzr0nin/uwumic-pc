name: Build Windows app
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyinstaller sounddevice numpy keyboard
      - run: pyinstaller --onefile --noconsole --name UwUMicClient uwumic_client.py
      - uses: actions/upload-artifact@v4
        with:
          name: UwUMicClient-exe
          path: dist/UwUMicClient.exe
